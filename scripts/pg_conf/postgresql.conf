# Shared/Common settings for both environments
port = 5432
max_connections = 50
superuser_reserved_connections = 1
unix_socket_directories = '/var/run/postgresql'

# Resource usage defaults (excluding memory buffers)
work_mem = 32MB	
maintenance_work_mem = 256MB
dynamic_shared_memory_type = posix
jit = off

# Asynchronous Behavior & IO
backend_flush_after = 0
effective_io_concurrency = 200
maintenance_io_concurrency = 200
random_page_cost = 1.1

# Parallelism
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2
max_parallel_workers = 4

# Write-Ahead Log & Replication (Disabled)
wal_level = minimal
max_wal_senders = 0
max_replication_slots = 0
archive_mode = off
wal_compression = lz4
wal_buffers = 16MB

# Checkpoints
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 80MB

# Client Defaults and Logging
log_line_prefix = '%m [%p] %q%u@%d '
cluster_name = 'arch-stats'
datestyle = 'iso, dmy'
default_text_search_config = 'pg_catalog.english'

include = 'secondary.conf'
