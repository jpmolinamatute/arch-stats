# Unique settings for the Raspberry Pi 5 (Production Environment)
data_directory = '/var/lib/postgresql/15/main'
hba_file = '/etc/postgresql/15/main/pg_hba.conf'
ident_file = '/etc/postgresql/15/main/pg_ident.conf'
external_pid_file = '/var/run/postgresql/15-arch-stats.pid'

# Local Unix Socket Connections Only
listen_addresses = ''
ssl = off

# Memory allocations optimized for Raspberry Pi 5 (8GB RAM)
shared_buffers = 1GB
effective_cache_size = 6GB

# Timezone settings
timezone = 'America/Toronto'
log_timezone = 'America/Toronto'
