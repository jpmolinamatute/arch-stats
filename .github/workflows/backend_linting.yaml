name: Backend Lint, Format & Test

on:
  pull_request:
    paths:
      - backend/**/*.go
      - backend/go.mod
      - backend/go.sum
      - backend/.golangci.yml
      - .github/workflows/backend_linting.yaml
      - .github/actions/go-setup/**

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go & Install Dependencies
        uses: ./.github/actions/go-setup
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend

  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go & Install Dependencies
        uses: ./.github/actions/go-setup
      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest
      - name: Check formatting
        run: |
          unformatted=$(gofumpt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofumpt:"
            echo "$unformatted"
            exit 1
          fi

  vet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Go & Install Dependencies
        uses: ./.github/actions/go-setup
      - name: Run go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    needs:
      - lint
      - format-check
      - vet
    services:
      postgres:
        image: postgres:17.2
        env:
          POSTGRES_USER: "admin"
          POSTGRES_PASSWORD: "NOT_A_REAL_PASSWORD"
          POSTGRES_DB: "arch-stats"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.MIGRATIONS_PAT }}
      - name: Checkout migrations repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MIGRATIONS_REPOSITORY }}
          token: ${{ secrets.MIGRATIONS_PAT }}
          path: backend/migrations
      - name: Setup Go & Install Dependencies
        uses: ./.github/actions/go-setup
      - name: Build binary
        run: go build -o ./arch-stats ./cmd/arch-stats
      - name: Run migrations
        env:
          POSTGRES_USER: "admin"
          POSTGRES_PASSWORD: "NOT_A_REAL_PASSWORD"
          POSTGRES_DB: "arch-stats"
          POSTGRES_HOST: "127.0.0.1"
          POSTGRES_PORT: "5432"
          ARCH_STATS_DEV_MODE: "true"
          ARCH_STATS_GOOGLE_OAUTH_CLIENT_ID: "NOT_A_REAL_CLIENT_ID"
          ARCH_STATS_JWT_SECRET: "dev-insecure-change-me"
          POSTGRES_POOL_MIN_SIZE: "1"
        run: ./arch-stats migrate
      - name: Run tests
        env:
          POSTGRES_USER: "admin"
          POSTGRES_PASSWORD: "NOT_A_REAL_PASSWORD"
          POSTGRES_DB: "arch-stats"
          POSTGRES_HOST: "127.0.0.1"
          POSTGRES_PORT: "5432"
          ARCH_STATS_DEV_MODE: "true"
          ARCH_STATS_GOOGLE_OAUTH_CLIENT_ID: "NOT_A_REAL_CLIENT_ID"
          ARCH_STATS_JWT_SECRET: "dev-insecure-change-me"
        run: go test ./... -v -count=1 -race
