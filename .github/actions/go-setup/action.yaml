name: Go Setup
description: Sets up Go and downloads backend dependencies
runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.27.0"
        cache-dependency-path: backend/go.sum
    - name: Download Go dependencies
      shell: bash
      working-directory: backend
      run: go mod download
