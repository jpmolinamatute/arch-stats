name: arch-stats

networks:
  arch-stats:
    driver: bridge

services:
  db:
    image: postgres:15
    profiles:
      - dev
    env_file:
      - ./.env
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - arch-stats
    environment:
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg_conf/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./pg_conf/secondary.conf:/etc/postgresql/secondary.conf
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5432
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  migrations:
    image: flyway/flyway:latest
    profiles:
      - dev
    command:
      - migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend/migrations:/flyway/sql
    env_file:
      - ./.env
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - FLYWAY_USER=${POSTGRES_USER}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
      - FLYWAY_LOCATIONS=filesystem:/flyway/sql
    networks:
      - arch-stats

  emulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rpi
    privileged: true
    profiles:
      - emulator
    ports:
      - "2222:22"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    cgroup: host
    networks:
      - arch-stats

volumes:
  pgdata:
