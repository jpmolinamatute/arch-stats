name: arch-stats

networks:
  arch-stats:
    driver: bridge

services:
  db:
    image: postgres:17
    profiles:
      - dev
    env_file:
      - ./.env
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - arch-stats
    environment:
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg_conf/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./pg_conf/secondary.conf:/etc/postgresql/secondary.conf
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5432
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # Migrations are handled by the Go binary via embedded goose.
    # Run: ./arch-stats migrate
    # Or set APPLY_DB_MIGRATIONS_ON_START=true for auto-migration on startup.

  emulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rpi
    privileged: true
    profiles:
      - emulator
    ports:
      - "2222:22"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    cgroup: host
    networks:
      - arch-stats

volumes:
  pgdata:
