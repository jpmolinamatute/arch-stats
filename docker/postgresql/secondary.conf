# Unique settings for the Docker Development Environment
data_directory = '/var/lib/postgresql/15/main'
hba_file = '/etc/postgresql/15/main/pg_hba.conf'
ident_file = '/etc/postgresql/15/main/pg_ident.conf'
external_pid_file = '/var/run/postgresql/15-arch-stats.pid'

# Accept TCP connections from host/other containers in development
listen_addresses = '*'
ssl = off

# Memory allocations for Docker Development (conservatively sized)
shared_buffers = 128MB
effective_cache_size = 512MB

# Timezone settings
timezone = 'America/Toronto'
log_timezone = 'America/Toronto'
